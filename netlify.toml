[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Domain routing: each subdomain's home address serves its own page.
# The earlier rules used conditions = {Host = [...]}, which Netlify does not apply,
# so every subdomain was showing the eligibility survey. These use the full
# address in "from" instead. Only "/" is rewritten, so images and functions
# on every subdomain keep working. index.html also carries a fallback router.
# admin.brazenrecruits.com is a separate Netlify site (brazenrecruits-command).

[[redirects]]
  from = "https://form.brazenrecruits.com/"
  to = "/appointment.html"
  status = 200
  force = true

[[redirects]]
  from = "https://apply.brazenrecruits.com/"
  to = "/apply.html"
  status = 200
  force = true

[[redirects]]
  from = "https://application.brazenrecruits.com/"
  to = "/apply.html"
  status = 200
  force = true

[[redirects]]
  from = "https://shortapp.brazenrecruits.com/"
  to = "/shortapp.html"
  status = 200
  force = true

[[redirects]]
  from = "https://faq.brazenrecruits.com/"
  to = "/faq.html"
  status = 200
  force = true

[[redirects]]
  from = "https://3things.brazenrecruits.com/"
  to = "/faq.html"
  status = 200
  force = true

[[redirects]]
  from = "https://parttime.brazenrecruits.com/"
  to = "/part-time.html"
  status = 200
  force = true

[[redirects]]
  from = "https://refer.brazenrecruits.com/"
  to = "/refer.html"
  status = 200
  force = true

[[redirects]]
  from = "https://packet.brazenrecruits.com/"
  to = "/packet.html"
  status = 200
  force = true

# eligibility.brazenrecruits.com serves index.html (the default),
# so no redirect rule is needed — it just works.

# Disable caching on HTML files to ensure fresh deploys are served immediately
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
